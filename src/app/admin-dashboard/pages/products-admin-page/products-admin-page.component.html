<h1 class="text-2xl font-bold">Lista de productos</h1>
<h3 class="text-lg">Total de productos
   <span class="text-accent">{{productsResource.value()?.count}}</span>
</h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
   <pagination [pages]="productsResource.value()?.pages ?? 0" [currentPage]="paginationService.currentPage()"></pagination>

   <select class="select select-bordered w-32" #selectPerPage (change)="productsPerPage.set(+selectPerPage.value)">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
   </select>

   <div class="flex flex-1"></div>

   <button class="btn btn-primary" routerLink="/admin/product/new">Nuevo producto</button>
</div>

<product-table [products]="productsResource.value()?.products ?? []"></product-table>
